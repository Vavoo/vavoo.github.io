<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride Comm</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; color: #1a1a1a; background: #ffffff; text-align: center;
  }
  h1 { font-size: 1.8rem; margin: 0 0 8px; }
  p { color: #555; max-width: 420px; line-height: 1.5; }
  a { color: #6b4eff; }
  @media (prefers-color-scheme: dark) {
    body { color: #e6e6e6; background: #121212; }
    p { color: #b3b3b3; }
    a { color: #b3a4ff; }
  }
</style>
</head>
<body>
  <div>
    <h1>Ride Comm</h1>
    <p>Signal your riding group without taking your eyes off the road.
    Get it on <a href="https://play.google.com/store/apps/details?id=com.ridecomm.app">Google Play</a>.</p>
  </div>
</body>
</html>
